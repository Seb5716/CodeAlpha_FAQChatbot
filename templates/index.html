<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopEasy Help</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='fonts/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='10' fill='%23FFD23F' stroke='%231A1C3A' stroke-width='3'/></svg>">
</head>
<body>
  <div class="page">
    <aside class="rail" id="rail" aria-label="Help topics">
      <button class="rail-close" id="railClose" aria-label="Close topics">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </button>
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="10" width="34" height="26" rx="6" fill="#FFD23F" stroke="#1A1C3A" stroke-width="3"/><path d="M13 16v-3a7 7 0 0 1 14 0v3" fill="none" stroke="#1A1C3A" stroke-width="3" stroke-linecap="round"/></svg>
        <div>
          <p class="brand-name">ShopEasy</p>
          <p class="brand-sub">Help centre</p>
        </div>
      </div>

      <h2 class="rail-title">Browse by topic</h2>
      <label class="search">
        <span class="sr-only">Filter questions</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <input id="topicFilter" type="search" placeholder="Filter questions" autocomplete="off">
      </label>
      <nav id="topics" class="topics"></nav>

      <div class="rail-foot">
        <p><strong>Still stuck?</strong> Call {{ meta.support_phone }}<br>Mon–Sat, 9am–6pm</p>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="chat" aria-label="Chat with Sunny">
      <header class="chat-head">
        <button class="topics-toggle" id="topicsToggle" aria-controls="rail" aria-expanded="false">Topics</button>
        <div class="avatar avatar-lg" aria-hidden="true"></div>
        <div class="who">
          <h1>{{ meta.name }}</h1>
          <p><span class="dot"></span>ShopEasy assistant, replies instantly</p>
        </div>
        <button class="ghost" id="clearBtn" title="Start a new conversation">New chat</button>
      </header>

      <section class="log" id="log" aria-live="polite"></section>

      <div class="starters" id="starters"></div>

      <form class="composer" id="composer" autocomplete="off">
        <label for="msg" class="sr-only">Your question</label>
        <textarea id="msg" rows="1" maxlength="500" placeholder="Type your question…"></textarea>
        <button type="submit" class="send" id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <p class="composer-hint">Enter to send, Shift + Enter for a new line. Never share OTPs or card numbers.</p>
    </main>
  </div>

  <template id="tplBot">
    <div class="row bot">
      <div class="avatar" aria-hidden="true"></div>
      <div class="stack">
        <div class="bubble"></div>
      </div>
    </div>
  </template>

  <script>window.SUNNY = {{ meta | tojson }};</script>
  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
